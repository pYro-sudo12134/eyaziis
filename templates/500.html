{% extends "base.html" %}

{% block title %}Ошибка сервера{% endblock %}

{% block content %}
<div class="row min-vh-75">
    <div class="col-md-8 offset-md-2 text-center py-5">
        <div class="error-template py-5">
            <h1 class="display-1 text-muted">500</h1>
            <h2 class="display-4">Ошибка сервера</h2>
            <div class="error-details my-4">
                <p class="lead">Что-то пошло не так. Наши специалисты уже работают над этим.</p>
                <p class="text-muted">Попробуйте обновить страницу или вернуться позже.</p>
            </div>
            <div class="error-actions">
                <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
                    <i class="bi bi-house-door"></i> На главную
                </a>
                <button onclick="location.reload()" class="btn btn-outline-secondary btn-lg ms-2">
                    <i class="bi bi-arrow-clockwise"></i> Обновить
                </button>
            </div>
        </div>
    </div>
</div>

<style>
.min-vh-75 {
    min-height: 75vh;
    display: flex;
    align-items: center;
}
.error-template {
    animation: fadeIn 0.5s ease-in;
}
</style>
{% endblock %}
